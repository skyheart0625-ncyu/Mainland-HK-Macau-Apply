<!DOCTYPE html>
<html lang="zh-TW">
<head><meta http-equiv="Content-Type" content="text/html; charset=utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>國立嘉義大學教職員赴陸港澳申請指引</title>
	<style type="text/css">* {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: #ffffff;
            max-width: 720px;
            width: 100%;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h1 {
            font-size: 1.35rem;
            color: #1a365d;
            margin-top: 0;
            text-align: center;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 12px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            color: #2d3748;
            font-size: 0.95rem;
        }
        select, input[type="date"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 0.95rem;
            background-color: #fff;
            outline: none;
        }
        select:focus, input[type="date"]:focus {
            border-color: #3182ce;
        }
        .date-hint {
            font-size: 0.83rem;
            color: #e53e3e;
            margin-top: 4px;
            font-weight: bold;
        }
        button {
            width: 100%;
            background-color: #2b6cb0;
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #2c5282;
        }
        .result-card {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background-color: #f7fafc;
            border-left: 5px solid #3182ce;
            border-radius: 4px;
        }
        .tag {
            display: inline-block;
            background-color: #2b6cb0;
            color: #ffffff;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 12px;
        }
        .deadline-badge {
            display: inline-block;
            background-color: #c53030;
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.88rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .result-title {
            font-size: 1.05rem;
            font-weight: bold;
            color: #1a365d;
            margin-bottom: 15px;
        }
        .step-list {
            padding-left: 20px;
            margin: 0;
        }
        .step-list li {
            margin-bottom: 12px;
            line-height: 1.5;
            color: #4a5568;
            font-size: 0.95rem;
        }
        .download-box {
            background-color: #ebf8ff;
            border: 1px solid #bae6fd;
            color: #0369a1;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            font-size: 0.9rem;
            line-height: 1.6;
        }
        .download-box a {
            color: #0284c7;
            font-weight: bold;
            text-decoration: underline;
        }
        .download-box ul {
            margin: 5px 0 0 0;
            padding-left: 20px;
        }
        .warning-box {
            background-color: #fffaf0;
            border: 1px solid #feebc8;
            color: #c05621;
            padding: 12px;
            border-radius: 6px;
            margin-top: 15px;
            font-size: 0.88rem;
            line-height: 1.5;
        }
        .penalty-box {
            background-color: #fff5f5;
            border: 1px solid #fed7d7;
            color: #9b2c2c;
            padding: 12px;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 0.88rem;
            line-height: 1.5;
        }
	</style>
</head>
<body>
<div class="container">
<h1>國立嘉義大學教職員赴陸港澳申請指引</h1>

<div class="form-group"><label for="identity">1. 請選擇您的身分類別：</label> <select id="identity" onchange="toggleRankSelect()"><option value="">-- 請選擇身分 --</option><option value="teacher">一般專任教師（未兼任行政職務）</option><option value="admin_teacher">兼任行政職務教師 / 公務人員</option><option value="contract_staff">一般未分簡薦委人員（專案/契約人員）</option> </select></div>

<div class="form-group" id="rankGroup" style="display: none;"><label for="rank">2. 請選擇兼任行政職務層級（以支領主管加給為依據）：</label> <select id="rank"><option value="rank12">相當簡任第 12 職等以上</option><option value="rank11">相當簡任第 11 職等（一級主管：如教務長、院長、系主任、中心主任等）</option><option value="rank10">相當簡任第 10 職等以下（二級主管：如組長等）</option> </select></div>

<div class="form-group"><label for="exitDate">3. 預計出境日期（查驗通關日）：</label> <input id="exitDate" type="date" />
<div class="date-hint">⚠️ 提醒：若搭乘凌晨航班（如 01:00 飛機），須於前一日晚上（如 23:00）通報出關，請輸入前一日之日期，以免無法出境！</div>
</div>

<div class="form-group"><label for="destination">4. 預計前往地點（含入境與不入境過境轉機）：</label> <select id="destination"><option value="mainland">僅前往中國大陸地區</option><option value="hk_macau">僅前往香港或澳門地區</option><option value="both">同時前往大陸及港澳地區（連訪/轉機）</option> </select></div>

<div class="form-group"><label for="purpose">5. 出國事由：</label> <select id="purpose"><option value="official">因公務事由前往</option><option value="private">非因公務事由前往（觀光、休假、私事）</option> </select></div>

<div class="form-group" id="meetGroup" style="display: none;"><label for="meetTarget">6. 是否會見或聯繫特定身分人員（赴港澳）：</label> <select id="meetTarget"><option value="no">未會見或聯繫特定身分人員</option><option value="yes">會見或聯繫特定身分人員</option> </select></div>
<button onclick="calculateGuidance()">產生申請指引與辦理期限</button>

<div class="result-card" id="result">
<div class="tag" id="identityTag">判斷結果</div>

<div class="deadline-badge" id="deadlineBadge" style="display:none;">&nbsp;</div>

<div class="result-title" id="resultTitle">辦理程序與作業流程指引：</div>

<ol class="step-list" id="stepList">
</ol>

<div class="download-box" id="downloadBox">📁 <strong>所需申請表件與登錄連結：</strong>

<ul id="downloadList">
</ul>

<hr style="border:0; border-top:1px solid #bae6fd; margin:10px 0;" /> 👉 <a href="https://www.ncyu.edu.tw/personnel/Subject/Detail/232082?nodeId=35206" rel="noopener noreferrer" target="_blank">前往國立嘉義大學人事室&mdash;赴陸港澳專區首頁</a>[cite: 1, 2]</div>

<div class="warning-box" id="warningBox">&nbsp;</div>

<div class="penalty-box" id="penaltyBox">&nbsp;</div>
</div>
</div>
<script>
function toggleRankSelect() {
    const identity = document.getElementById('identity').value;
    const rankGroup = document.getElementById('rankGroup');
    const meetGroup = document.getElementById('meetGroup');
    
    if (identity === 'admin_teacher') {
        rankGroup.style.display = 'block';
    } else {
        rankGroup.style.display = 'none';
    }
    
    if (identity === 'admin_teacher' || identity === 'contract_staff') {
        meetGroup.style.display = 'block';
    } else {
        meetGroup.style.display = 'none';
    }
}

function calculateGuidance() {
    const identity = document.getElementById('identity').value;
    const rank = document.getElementById('rank').value;
    const exitDateVal = document.getElementById('exitDate').value;
    const destination = document.getElementById('destination').value;
    const purpose = document.getElementById('purpose').value;
    const meetTarget = document.getElementById('meetTarget').value;
    
    const resultDiv = document.getElementById('result');
    const identityTag = document.getElementById('identityTag');
    const deadlineBadge = document.getElementById('deadlineBadge');
    const stepList = document.getElementById('stepList');
    const downloadList = document.getElementById('downloadList');
    const warningBox = document.getElementById('warningBox');
    const penaltyBox = document.getElementById('penaltyBox');

    if (!identity) {
        alert('請選擇身分類別！');
        return;
    }

    resultDiv.style.display = 'block';
    stepList.innerHTML = '';
    downloadList.innerHTML = '';
    deadlineBadge.style.display = 'none';
    
    let includesMainland = (destination === 'mainland' || destination === 'both');
    let includesHKMacau = (destination === 'hk_macau' || destination === 'both');
    let isTeacher = (identity === 'teacher');
    
    let identityText = document.getElementById('identity').options[document.getElementById('identity').selectedIndex].text;
    identityTag.innerText = identityText;

    // 計算最晚送件日
    if (exitDateVal && !isTeacher) {
        let exitDate = new Date(exitDateVal);
        let weeksToSubtract = 2;

        if (includesHKMacau) {
            if (purpose === 'official' && rank === 'rank12') weeksToSubtract = 3;
            if (meetTarget === 'yes') {
                if (rank === 'rank12') weeksToSubtract = 5;
                else weeksToSubtract = 2;
            }
        }
        if (includesMainland) weeksToSubtract = 2;

        let deadlineDate = new Date(exitDate);
        deadlineDate.setDate(deadlineDate.getDate() - (weeksToSubtract * 7));
        
        let yyyy = deadlineDate.getFullYear();
        let mm = String(deadlineDate.getMonth() + 1).padStart(2, '0');
        let dd = String(deadlineDate.getDate()).padStart(2, '0');
        
        deadlineBadge.innerText = `最晚須於 ${yyyy}-${mm}-${dd} 前（出境日 ${weeksToSubtract} 週前）完成送件！`;
        deadlineBadge.style.display = 'inline-block';
    }

    let steps = [];
    let warnings = [];
    let penalties = [];
    let files = [];

    // 固定連結網址
    const urlPortal = "https://www.ncyu.edu.tw/personnel/Subject/Detail/232082?nodeId=35206";
    const urlMAC = "https://www.mac.gov.tw/cp.aspx?n=015A70099E11C8A8";

    // --- 一、一般教師 ---
    if (isTeacher) {
        steps.push("<strong>【校內請假】</strong>循本校出國申請流程辦理並經核准。");
        steps.push("<strong>【行前動態登錄】</strong>赴陸港澳前至陸委會「國人赴陸港澳動態登錄系統」進行線上登錄。");
        steps.push("<strong>【完成手續】</strong>未兼任行政職教師無須送內政部或校長事前核准，亦無須填寫返臺通報表。");
        
        files.push(`🌐 <a href="${urlMAC}" target="_blank">大陸委員會—國人赴陸港澳動態登錄系統 (線上登錄)</a>`);
    } else {
        // --- 二、兼任行政職教師 / 公務人員 / 契約人員 ---
        
        // 1. 赴大陸程序與表件
        if (includesMainland) {
            steps.push("<strong><big>【赴大陸地區作業程序】</big></strong>");
            steps.push("循本校出國申請流程辦理並經核准。[cite: 3]");
            
            if (identity === 'admin_teacher' && (rank === 'rank11' || rank === 'rank12')) {
                steps.push(" <strong>至遲出境日 2 週前</strong>填具「簡任第 11 職等以上赴大陸地區申請表」，送人事室函報<strong>內政部核准</strong>。");
                steps.push("報經內政部許可始得赴陸。[cite: 3]");
                steps.push("赴陸前至陸委會「國人赴陸港澳動態登錄系統」進行線上登錄。");
                steps.push(" <strong>返臺 1 星期內</strong>填寫「赴陸人員返臺通報表」，送人事室<strong>通報內政部</strong>。");
                
                files.push(`📄 <a href="${urlPortal}" target="_blank">簡任第 11 職等以上人員進入大陸地區申請表 (下載)</a>`);
                files.push(`📄 <a href="${urlPortal}" target="_blank">赴陸人員返臺通報表 (下載)</a>`);
            } else {
                steps.push(" <strong>至遲出境日 2 週前</strong>填具「簡任第 10 職等以下赴大陸地區申請表」，送人事室辦理（會辦政風）。");
                steps.push("奉<strong>校長核准同意</strong>。");
                steps.push("赴陸前至陸委會「國人赴陸港澳動態登錄系統」進行線上登錄。");
                steps.push("5. <strong>返臺 1 星期內</strong>填寫「赴陸人員返臺通報表」，送人事室<strong>備查</strong>。");
                
                files.push(`📄 <a href="${urlPortal}" target="_blank">簡任第 10 職等以下人員赴大陸地區申請表 (下載)</a>`);
                files.push(`📄 <a href="${urlPortal}" target="_blank">赴陸人員返臺通報表 (下載)</a>`);
            }
            penalties.push("<strong>赴陸違規懲處：</strong>未依規定完成申請程序者，依公務人員考績法及學校相關法規懲處。");
        }

        // 2. 赴港澳程序與表件
        if (includesHKMacau) {
            steps.push("<strong><big>【赴港澳地區作業程序】</big></strong>");
            steps.push("1. 依校內出國申請流程辦理並經核准。");

            if (purpose === 'official') {
                if (rank === 'rank12') {
                    steps.push(" <strong>出境日 3 週前</strong>填具因公赴港澳通報表，送人事室通報<strong>陸委會</strong>。");
                } else {
                    steps.push(" <strong>出境日 2 週前</strong>填具因公赴港澳通報表，送人事室通報<strong>陸委會</strong>。");
                }
                files.push(`📄 <a href="${urlPortal}" target="_blank">公務人員因公赴香港澳門通報表 (下載)</a>`);
            } else {
                if (meetTarget === 'no') {
                    steps.push(" <strong>出境日 2 週前</strong>填具非因公赴港澳通報表送人事室。");
                    files.push(`📄 <a href="${urlPortal}" target="_blank">非因公務事由赴香港或澳門通報表 (下載)</a>`);
                }
            }

            if (meetTarget === 'yes') {
                if (rank === 'rank12') {
                    steps.push("3. <strong>出境日 5 週前</strong>填具會見或聯繫特定身分人員通報表送人事室通報。");
                } else {
                    steps.push("3. <strong>出境日 2 週前</strong>填具會見或聯繫特定身分人員通報表送人事室通報。");
                }
                files.push(`📄 <a href="${urlPortal}" target="_blank">赴香港或澳門會見或聯繫特定身分人員通報表 (下載)</a>`);
            }

            steps.push("至陸委會官網「國人赴陸港澳動態登錄系統」進行登錄，並將<strong>登錄結果影送人事室留存</strong>。");
            steps.push("5. <strong>臨時會見補通報：</strong>若於港澳期間臨時會見或聯繫特定身分人員未經事前通報，應於<strong>返臺 3 日內</strong>主動填具通報表送人事室通報陸委會。");

            penalties.push("<strong>赴港澳未依規通報懲處：</strong>依校內人事法規懲處。");
        }

        files.push(`🌐 <a href="${urlMAC}" target="_blank">大陸委員會—國人赴陸港澳動態登錄系統 (線上登錄)</a>`);
    }

    // --- 通用注意事項 ---
    warnings.push("<strong>⚠️ 國立嘉義大學重點宣導與提醒：</strong>");
    warnings.push(" <strong>出境日期以「查驗通關日」為準：</strong>若出關與搭機時間不同（例如凌晨 01:00 飛機，在前一日晚上 23:00 查驗出關），<strong>申請赴陸港澳之起始日期應以「前一日（出關日）」為準</strong>，避免因許可生效日期不符而無法出境。");
    warnings.push(" <strong>過境轉機：</strong>搭乘航班經中國大陸或港澳地區機場「入境轉機」或「不入境之過境轉機」，均須依上述規定辦理。");
    warnings.push(" <strong>不分平日假日：</strong>本校教師不分平日、假日赴港澳/大陸，行前均應至線上簽核差勤系統完成出國申請並經核准。");
    warnings.push(" <strong>人事室承辦窗口：</strong>人事室承辦人陳小姐（聯絡電話：05-2717196）。");

    // 渲染至 HTML
    steps.forEach(step => {
        let li = document.createElement('li');
        li.innerHTML = step;
        stepList.appendChild(li);
    });

    files.forEach(file => {
        let li = document.createElement('li');
        li.innerHTML = file;
        downloadList.appendChild(li);
    });

    warningBox.innerHTML = warnings.join('<br>');
    penaltyBox.innerHTML = penalties.length > 0 ? penalties.join('<br>') : "<strong>懲處規定：</strong>一般教師依校內一般請假差勤規定辦理。";
}
</script></body>
</html>
